services:
  livekit:
    # Pinned to an exact release. This matters more than which release: with
    # :latest, every future container recreation silently becomes an unplanned
    # upgrade with no rollback target. The previous deployment ran :latest and
    # drifted from the v1.9.8 build it was created with to whatever today's
    # latest is, purely because the container was eventually recreated.
    #
    # v1.13.7 digests / rollback references:
    #   v1.13.7  livekit/livekit-server@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    #   v1.9.8   livekit/livekit-server@sha256:ae6f913f12677b95898b1c9e3ff0e3c8ca2655c662c045dea706007fe19bcf9e
    # To roll back, set the image to that tag and redeploy.
    image: livekit/livekit-server:v1.13.7
    container_name: livekit-node
    restart: unless-stopped

    # Host networking is the whole point of this deployment.
    # It lets LiveKit own the media ports directly on the host: no Docker bridge,
    # no port publishing, no per-port proxy processes. That makes LiveKit's full
    # default media range (50000-60000) viable - publishing 10,000 ports through
    # Docker's userland proxy would spawn one helper process per port.
    # LiveKit's own deployment guide recommends host networking in Docker.
    network_mode: host

    # LiveKit ignores ad-hoc per-field environment variables for rtc.* settings,
    # so everything that matters lives in the config file.
    command: ["--config", "/etc/livekit.yaml"]

    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

    environment:
      # Supplied by the platform (Coolify / your env file). Never commit values.
      # LIVEKIT_KEYS is the "<api-key>: <api-secret>" pair LiveKit expects - the
      # space after the colon is required or the server refuses to start.
      #
      # Declared with `:?` so Compose refuses to start without them. Deliberately
      # NO inline message: Coolify's Compose parser reads the text after `:?` as
      # the variable's value, which silently ships the error message instead of
      # the credential and crash-loops the server.
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?}
      LIVEKIT_REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD:?}

    # Health is reported by the platform; LiveKit serves "OK" on its HTTP port.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      # Raw Compose Deployment mode: the platform does not add these for us.
      - coolify.managed=true
      - coolify.type=application
      - coolify.resourceName=livekit-node
