name: validate

# This repository is public: anything merged here is world-readable forever, and
# a broken route file or config silently takes the deployment down. So CI runs the
# same script a human runs locally - ./scripts/verify.sh - rather than a second,
# drifting copy of the checks. It validates the compose definition, asserts the
# config invariants, refuses committed credentials, and exercises the route file
# and server config against the real Traefik and LiveKit binaries.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA rather than a tag, so a compromised or
      # retagged upstream release cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify deployment definition
        run: ./scripts/verify.sh
